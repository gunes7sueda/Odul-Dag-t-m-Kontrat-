<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Distribution DApp</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
</head>
<body>

<div class="container">

    <header>
        <h1>🏆 Reward Distribution System</h1>
        <p>Blockchain Tabanlı Ödül Yönetim Platformu</p>
    </header>

    <div class="card wallet">
        <button onclick="connectWallet()">
            MetaMask Bağlan
        </button>
        <div class="wallet-address" id="walletAddress">
            Henüz bağlantı yapılmadı
        </div>
    </div>

    <div class="grid">

        <div class="card">
            <h2>Ödül Tanımla</h2>
            <br>
            <div class="form-group">
                <label>Kullanıcı Adresi</label>
                <input type="text" id="rewardAddress" placeholder="0x...">
            </div>

            <div class="form-group">
                <label>Ödül Miktarı</label>
                <input type="number" id="rewardAmount" placeholder="100">
            </div>

            <button onclick="assignReward()">
                Ödül Ekle
            </button>

            <div class="result" id="assignResult">
                İşlem sonucu burada görüntülenecek.
            </div>
        </div>

        <div class="card">
            <h2>Ödül Sorgula</h2>
            <br>
            <div class="form-group">
                <label>Kullanıcı Adresi</label>
                <input type="text" id="queryAddress" placeholder="0x...">
            </div>

            <button onclick="getReward()">
                Sorgula
            </button>

            <div class="result" id="rewardResult">
                Sonuç burada görüntülenecek.
            </div>
        </div>

    </div>

</div>

<script>
// Canlı Ağ Bilgilerin Sabit Tutuldu
const contractAddress = "0xbb2441a33cbbd0ce5ed131976ccf2ac7a0a90fe8";
const contractABI = [
    {
        "inputs":[
            {"internalType":"address","name":"user","type":"address"},
            {"internalType":"uint256","name":"amount","type":"uint256"}
        ],
        "name":"assignReward",
        "outputs":[],
        "stateMutability":"nonpayable",
        "type":"function"
    },
    {
        "inputs":[],
        "stateMutability":"nonpayable",
        "type":"constructor"
    },
    {
        "anonymous":false,
        "inputs":[
            {"indexed":true,"internalType":"address","name":"user","type":"address"},
            {"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"},
            {"indexed":false,"internalType":"uint256","name":"newTotal","type":"uint256"}
        ],
        "name":"RewardAssigned",
        "type":"event"
    },
    {
        "inputs":[],
        "name":"getOwner",
        "outputs":[{"internalType":"address","name":"","type":"address"}],
        "stateMutability":"view",
        "type":"function"
    },
    {
        "inputs":[{"internalType":"address","name":"user","type":"address"}],
        "name":"getReward",
        "outputs":[{"internalType":"uint256","name":"","type":"uint256"}],
        "stateMutability":"view",
        "type":"function"
    },
    {
        "inputs":[{"internalType":"address","name":"user","type":"address"}],
        "name":"isRegistered",
        "outputs":[{"internalType":"bool","name":"","type":"bool"}],
        "stateMutability":"view",
        "type":"function"
    },
    {
        "inputs":[],
        "name":"owner",
        "outputs":[{"internalType":"address","name":"","type":"address"}],
        "stateMutability":"view",
        "type":"function"
    }
];

let provider;
let signer;
let contract;

async function connectWallet(){
    try{
        if(!window.ethereum){
            alert("MetaMask bulunamadı.");
            return;
        }

        await window.ethereum.request({
            method: "eth_requestAccounts"
        });

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();

        contract = new ethers.Contract(
            contractAddress,
            contractABI,
            signer
        );

        const address = await signer.getAddress();

        document.getElementById("walletAddress").innerHTML =
        "Bağlı Cüzdan:<br><b>" + address + "</b>";

    }catch(error){
        console.error(error);
        alert("Cüzdan bağlantısı başarısız.");
    }
}

async function assignReward(){
    try{
        // Kontratın bağlı olup olmadığını kontrol edelim
        if (!contract) {
            alert("Lütfen önce MetaMask cüzdanınızı bağlayın!");
            return;
        }

        const user = document.getElementById("rewardAddress").value.trim();
        const amount = document.getElementById("rewardAmount").value;

        if(!user || !amount) {
            alert("Lütfen tüm alanları doldurun.");
            return;
        }

        document.getElementById("assignResult").innerHTML = "İşlem gönderildi, onay bekleniyor...";

        const tx = await contract.assignReward(user, amount);
        await tx.wait();

        document.getElementById("assignResult").innerHTML =
        "<span style='color: #27ae60; font-weight: bold;'>Ödül başarıyla tanımlandı.</span>";

    }catch(error){
        // DÜZELTME: Syntax hatası veren error string kurgusu güvenli hale getirildi
        let errMsg = error.reason || error.message || "Bilinmeyen hata";
        document.getElementById("assignResult").innerHTML =
        "<span style='color: #dc2626; font-weight: bold;'>Hata: " + errMsg + "</span>";
        console.error(error);
    }
}

async function getReward(){
    try{
        if (!contract) {
            alert("Lütfen önce MetaMask cüzdanınızı bağlayın!");
            return;
        }

        const user = document.getElementById("queryAddress").value.trim();
        if(!user) {
            alert("Lütfen sorgulanacak adresi girin.");
            return;
        }

        const reward = await contract.getReward(user);
        const registered = await contract.isRegistered(user);

        document.getElementById("rewardResult").innerHTML = `
            <strong>Kayıt Durumu:</strong> ${registered ? "Var 🟢" : "Yok ❌"}
            <br><br>
            <strong>Toplam Ödül:</strong> ${reward.toString()} Birim
        `;

    }catch(error){
        document.getElementById("rewardResult").innerHTML =
        "<span style='color: #dc2626; font-weight: bold;'>Sorgulama başarısız.</span>";
        console.error(error);
    }
}
</script>

</body>
</html>
